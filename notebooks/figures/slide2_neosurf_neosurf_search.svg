<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs><style type="text/css">
      .title { font-family: 'DejaVu Sans', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 40px; fill: #0F2A3A; }
      .subtitle { font-family: 'DejaVu Sans', Helvetica, Arial, sans-serif; font-weight: 400; font-size: 20px; fill: #5A6A75; }
      .h { font-family: 'DejaVu Sans', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 20px; fill: #0F2A3A; }
      .body { font-family: 'DejaVu Sans', Helvetica, Arial, sans-serif; font-weight: 400; font-size: 15px; fill: #3D4F5A; }
      .n { font-family: 'DejaVu Sans Mono', Menlo, monospace; font-weight: 700; font-size: 32px; fill: #0B6E6E; }
      .n-w { font-family: 'DejaVu Sans Mono', Menlo, monospace; font-weight: 700; font-size: 28px; fill: #FFFFFF; }
      .label { font-family: 'DejaVu Sans', Helvetica, Arial, sans-serif; font-weight: 500; font-size: 13px; fill: #5A6A75; }
      .label-w { font-family: 'DejaVu Sans', Helvetica, Arial, sans-serif; font-weight: 500; font-size: 13px; fill: #C8E4E4; }
      .repo { font-family: 'DejaVu Sans Mono', Menlo, monospace; font-weight: 500; font-size: 14px; fill: #7A5C1E; }
      .chip { font-family: 'DejaVu Sans Mono', Menlo, monospace; font-weight: 600; font-size: 13px; fill: #0F2A3A; }
      .badge { font-family: 'DejaVu Sans', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #FFFFFF; }
      .small { font-family: 'DejaVu Sans', Helvetica, Arial, sans-serif; font-weight: 400; font-size: 13px; fill: #5A6A75; }
</style></defs>
  <rect width="1920" height="1080" fill="#F7F4EC"/>
  <rect x="0" y="0" width="1920" height="8" fill="#0B6E6E"/>

  <text x="80" y="72" class="title">Neosurf-Neosurf search strategy</text>
  <text x="80" y="105" class="subtitle">Find seed proteins whose ligands are geometrically compatible with ligase-bound ligands</text>
  <rect x="80" y="122" width="620" height="28" rx="4" fill="#F0E6C8"/>
  <text x="92" y="141" class="repo">masif-neosurf-af2  |  branch Neosurf-Neosurf</text>

  <text x="80" y="195" class="h">A. Prepare MaSIF database</text>

  <rect x="80" y="215" width="860" height="78" rx="8" fill="#FFFFFF" stroke="#C9D4DA"/>
  <rect x="80" y="215" width="10" height="78" rx="2" fill="#0B6E6E"/>
  <text x="110" y="248" class="body" font-size="16" font-weight="600" fill="#0F2A3A">Download and fix PDB + SDF</text>
  <text x="110" y="272" class="body">Try 15,604 complexes; successfully recovered</text>
  <text x="880" y="262" text-anchor="end" class="n" font-size="26">14,988</text>

  <path d="M510 293 L510 312" stroke="#0B6E6E" stroke-width="2.5" fill="none"/>
  <polygon points="504,312 516,312 510,322" fill="#0B6E6E"/>

  <rect x="80" y="325" width="860" height="78" rx="8" fill="#FFFFFF" stroke="#C9D4DA"/>
  <rect x="80" y="325" width="10" height="78" rx="2" fill="#0B6E6E"/>
  <text x="110" y="358" class="body" font-size="16" font-weight="600" fill="#0F2A3A">MaSIF preprocessing</text>
  <text x="110" y="382" class="body">Surface features, site prediction, descriptors</text>
  <text x="880" y="372" text-anchor="end" class="n" font-size="26">13,407</text>

  <path d="M510 403 L510 422" stroke="#0B6E6E" stroke-width="2.5" fill="none"/>
  <polygon points="504,422 516,422 510,432" fill="#0B6E6E"/>

  <rect x="80" y="435" width="860" height="280" rx="10" fill="#FFFFFF" stroke="#0B6E6E" stroke-width="2"/>
  <text x="110" y="470" class="body" font-size="16" font-weight="600" fill="#0F2A3A">Split by UniProt ID</text>
  <text x="110" y="494" class="body">Same preprocessing tree; roles differ at search time</text>

  <rect x="110" y="520" width="380" height="160" rx="8" fill="#0B6E6E"/>
  <text x="130" y="555" class="badge" font-size="16">TARGETS</text>
  <text x="130" y="582" class="label-w">Known glueable ligases</text>
  <text x="130" y="608" class="n-w" font-size="22">CRBN | VHL | ...</text>
  <text x="130" y="640" class="label-w">6 ligase UniProt IDs</text>
  <text x="130" y="662" class="label-w">128 unique ligase-ligand structures</text>

  <rect x="520" y="520" width="380" height="160" rx="8" fill="#C47A12"/>
  <text x="540" y="555" class="badge" font-size="16">SEEDS</text>
  <text x="540" y="582" class="label-w" fill="#F8E8C8">Everything else</text>
  <text x="540" y="618" class="n-w" font-size="36" fill="#FFFFFF">~13,140</text>
  <text x="540" y="648" class="label-w" fill="#F8E8C8">ligand-bound protein complexes</text>
  <text x="540" y="670" class="label-w" fill="#F8E8C8">candidate proximity partners</text>

  <text x="1020" y="195" class="h">B. Neosurf-Neosurf query</text>
  <rect x="1020" y="215" width="820" height="500" rx="10" fill="#FFFFFF" stroke="#C9D4DA"/>

  <ellipse cx="1220" cy="400" rx="130" ry="95" fill="#D6EEEE" stroke="#0B6E6E" stroke-width="3"/>
  <text x="1220" y="350" text-anchor="middle" class="chip" fill="#0B6E6E">TARGET</text>
  <text x="1220" y="375" text-anchor="middle" class="small">E3 ligase</text>
  <rect x="1285" y="395" width="36" height="24" rx="4" fill="#0B6E6E"/>
  <text x="1303" y="412" text-anchor="middle" class="badge" font-size="11">L1</text>
  <text x="1220" y="455" text-anchor="middle" class="small">ligand-bound surface</text>

  <ellipse cx="1640" cy="400" rx="130" ry="95" fill="#F5E4C4" stroke="#C47A12" stroke-width="3"/>
  <text x="1640" y="350" text-anchor="middle" class="chip" fill="#C47A12">SEED</text>
  <text x="1640" y="375" text-anchor="middle" class="small">candidate protein</text>
  <rect x="1515" y="395" width="36" height="24" rx="4" fill="#C47A12"/>
  <text x="1533" y="412" text-anchor="middle" class="badge" font-size="11">L2</text>
  <text x="1640" y="455" text-anchor="middle" class="small">ligand-bound surface</text>

  <path d="M1325 407 L1510 407" stroke="#8B3A3A" stroke-width="2.5" stroke-dasharray="6 4" fill="none"/>
  <text x="1418" y="395" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="600" font-size="13" fill="#8B3A3A">ligand proximity</text>

  <rect x="1060" y="540" width="740" height="140" rx="8" fill="#F7F4EC"/>
  <text x="1085" y="575" class="body" font-size="16" font-weight="600" fill="#0F2A3A">Search setup</text>
  <text x="1085" y="605" class="body">For each of 128 unique ligase-ligand targets:</text>
  <text x="1085" y="630" class="body">query the seed database with MaSIF Neosurf-Neosurf</text>
  <text x="1085" y="655" class="body">rank seeds where L1 and L2 can sit near each other</text>

  <rect x="80" y="760" width="1760" height="230" rx="12" fill="#0F2A3A"/>
  <text x="120" y="810" class="badge" font-size="22">All-vs-all search matrix</text>
  <text x="120" y="845" class="label-w" font-size="16">128 targets  x  ~13,140 seeds  |  surface matching conditioned on both ligands</text>

  <rect x="120" y="875" width="520" height="80" rx="8" fill="#1A3D4A"/>
  <text x="145" y="910" class="badge" font-size="15">Compatible pose</text>
  <text x="145" y="935" class="label-w">Ligands approach without clash</text>

  <rect x="670" y="875" width="520" height="80" rx="8" fill="#1A3D4A"/>
  <text x="695" y="910" class="badge" font-size="15">Glueable geometry</text>
  <text x="695" y="935" class="label-w">Surfaces support ternary complex</text>

  <rect x="1220" y="875" width="520" height="80" rx="8" fill="#1A3D4A"/>
  <text x="1245" y="910" class="badge" font-size="15">Hit list</text>
  <text x="1245" y="935" class="label-w">Ranked seed-target proximity pairs</text>
</svg>
