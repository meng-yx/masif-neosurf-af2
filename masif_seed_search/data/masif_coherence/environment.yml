# Conda environment for MaSIF-Coherence (PyTorch NN training).
#
# Dependencies match masif_seed_search/source/masif_coherence/requirements.txt:
#   train.py  -> torch, numpy, scikit-learn (roc_auc_score)
#   data.py   -> torch, numpy, trimesh (.ply loading)
#   model.py  -> torch
#
# GPU stack: PyTorch 2.x CUDA 12.6 wheel installed via pip (from PyTorch's
# own index), which avoids conda channel resolution issues on HPC clusters.
# Aligned with NVIDIA H100 + driver 560.x (nvidia-smi "CUDA Version: 12.6").
# https://pytorch.org/get-started/locally/  (Stable, Linux, pip, CUDA 12.6)
#
# Create once:
#   conda env create -f masif_seed_search/data/masif_coherence/environment.yml
# Update after edits:
#   conda env update -f masif_seed_search/data/masif_coherence/environment.yml --prune

name: masif-coherence
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python>=3.10,<3.13
  - pip
  - numpy>=1.22
  - trimesh>=3.20
  - scikit-learn>=1.1
  - joblib>=1.2
  - tqdm>=4.65
  - pip:
    - --index-url https://download.pytorch.org/whl/cu126
    - --extra-index-url https://pypi.org/simple
    - torch>=2.0
    - ipykernel
    - pandas
    - numpy
